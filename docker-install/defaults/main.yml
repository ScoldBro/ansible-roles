---
docker_prerequisites:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

docker_dir: "/etc/apt/keyrings"
mode_docker_dir: "0755"
docker_sources_list: "/etc/apt/sources.list.d/docker.list"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_user: ladmin
