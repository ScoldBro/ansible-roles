---
- name: installation packages
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - "{{ packages }}"

- name: create directory for docker
  file:
    path: "{{ docker_dir }}"
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.asc
    mode: "0644"

- name: Dearmor Docker GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
    creates: /etc/apt/keyrings/docker.gpg

- name: Add docker repository to sources.list
  copy:
    dest: "{{ docker_sources_list }}"
    content: |
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    mode: '0644'

- name: apt-get update and install docker-ce
  apt:
    update_cache: yes
    state: present
    name: "{{ docker_packages }}"

- name: check docker
  service:
    name: docker
    state: started
    enabled: true
